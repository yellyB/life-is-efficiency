name: Update post dates

on:
  push:
    branches: [main]
    paths: ['content/**/*.md']

permissions:
  contents: write

jobs:
  add-post-dates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update dates of changed posts
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BASE="$BEFORE"
          else
            BASE="$(git rev-parse "$AFTER^")"
          fi
          git diff --name-only -z --diff-filter=AM "$BASE" "$AFTER" -- 'content/*.md' \
            | xargs -0 -r node scripts/post-dates.mjs fix > "$RUNNER_TEMP/created"
          git diff --name-only -z --diff-filter=M "$BASE" "$AFTER" -- 'content/*.md' \
            | xargs -0 -r node scripts/post-dates.mjs touch "$BASE" > "$RUNNER_TEMP/updated"

      - name: Commit updated dates
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- content
          join() { awk 'NR > 1 { printf ", " } { printf "%s", $0 }' "$1"; }
          CREATED="$(join "$RUNNER_TEMP/created")"
          UPDATED="$(join "$RUNNER_TEMP/updated")"
          MESSAGE=''
          if [ -n "$CREATED" ]; then MESSAGE="$CREATED 작성일 추가"; fi
          if [ -n "$UPDATED" ]; then MESSAGE="${MESSAGE:+$MESSAGE, }$UPDATED 수정일 갱신"; fi
          git commit -m "chore: $MESSAGE"
          git push
